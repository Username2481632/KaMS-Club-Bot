name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub Actions default runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy src directory to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "src/"
          target: "~/KaMS-Club-Bot/src/"
          rm: true
          strip_components: 1

      - name: Deploy ip-updater directory to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "ip-updater/"
          target: "~/KaMS-Club-Bot/ip-updater/"
          rm: true
          strip_components: 1

      - name: Deploy bot service files to Raspberry Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "kams-bot@.service,kams-bot-startup-deploy@.service"
          target: "~/KaMS-Club-Bot/"
          overwrite: true

      - name: Update systemd services if changed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Check if service files have changed and update them
            if [ -f ~/KaMS-Club-Bot/ip-updater/ip-updater@.service ]; then
              echo "Checking for systemd service updates..."
              
              # Compare with installed service files
              SERVICE_CHANGED=false
              TIMER_CHANGED=false
              
              if ! diff -q ~/KaMS-Club-Bot/ip-updater/ip-updater@.service /etc/systemd/system/ip-updater@.service >/dev/null 2>&1; then
                SERVICE_CHANGED=true
              fi
              
              if ! diff -q ~/KaMS-Club-Bot/ip-updater/ip-updater@.timer /etc/systemd/system/ip-updater@.timer >/dev/null 2>&1; then
                TIMER_CHANGED=true
              fi
              
              if [ "$SERVICE_CHANGED" = true ] || [ "$TIMER_CHANGED" = true ]; then
                echo "Service files have changed, updating..."
                sudo cp ~/KaMS-Club-Bot/ip-updater/ip-updater@.service /etc/systemd/system/
                sudo cp ~/KaMS-Club-Bot/ip-updater/ip-updater@.timer /etc/systemd/system/
                sudo systemctl daemon-reload
                echo "Systemd services updated and reloaded"
                
                # Restart the timer if it was running
                if systemctl is-active --quiet ip-updater@$(whoami).timer; then
                  sudo systemctl restart ip-updater@$(whoami).timer
                  echo "IP updater timer restarted"
                fi
              else
                echo "No changes to systemd service files"
              fi
              
              # Clean up - remove service files from Pi (they're now in /etc/systemd/system/)
              rm -f ~/KaMS-Club-Bot/ip-updater/ip-updater@.service
              rm -f ~/KaMS-Club-Bot/ip-updater/ip-updater@.timer
            fi

            BOT_UNITS_CHANGED=false
            for unit in kams-bot@.service kams-bot-startup-deploy@.service; do
              if ! diff -q ~/KaMS-Club-Bot/$unit /etc/systemd/system/$unit >/dev/null 2>&1; then
                echo "$unit has changed, updating..."
                sudo cp ~/KaMS-Club-Bot/$unit /etc/systemd/system/
                BOT_UNITS_CHANGED=true
              fi
              rm -f ~/KaMS-Club-Bot/$unit
            done
            if [ "$BOT_UNITS_CHANGED" = true ]; then
              sudo systemctl daemon-reload
              echo "Bot services updated and reloaded"
            else
              echo "No changes to the bot service files"
            fi

      - name: Check if upgrade script is non-empty
        id: check_script
        run: |
          if [ -s upgrade_script.sh ]; then
            echo "SCRIPT_NON_EMPTY=true" >> $GITHUB_ENV
          else
            echo "SCRIPT_NON_EMPTY=false" >> $GITHUB_ENV
          fi

      - name: Copy over upgrade script
        if: env.SCRIPT_NON_EMPTY == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "upgrade_script.sh"
          target: "~/KaMS-Club-Bot/"
          overwrite: true

      - name: Run & delete upgrade script
        if: env.SCRIPT_NON_EMPTY == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/KaMS-Club-Bot
            chmod +x upgrade_script.sh
            ./upgrade_script.sh
            rm ~/KaMS-Club-Bot/upgrade_script.sh

      - name: Install dependencies on Raspberry Pi and restart the bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/KaMS-Club-Bot
            
            if [ ! -d "venv" ]; then
              python3.12 -m venv venv
            fi
            
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r <(curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/requirements.txt")
            
            # The bot reads its token from .env, as it does when run from a checkout.
            (umask 077 && echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" > .env)
            sudo systemctl enable kams-bot@$(whoami).service kams-bot-startup-deploy@$(whoami).service
            # A deploy starts the bot even after its restart limit was hit.
            sudo systemctl reset-failed kams-bot@$(whoami).service
            sudo systemctl restart kams-bot@$(whoami).service
